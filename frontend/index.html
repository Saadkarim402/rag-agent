<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelRAG Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="top-nav">
        <div class="tags-container">
            <button class="tag active"><i class="fa-solid fa-brain"></i> Basic RAG</button>
        </div>
    </header>

    <main class="app-container">
        <!-- Sidebar for configuration and upload -->
        <aside class="sidebar">
            <div class="glass-panel">
                <h2><i class="fa-solid fa-gear"></i> Configuration</h2>
                <div class="input-group">
                    <label for="collectionName">Collection Name</label>
                    <input type="text" id="collectionName" value="documents">
                </div>
                
                <hr>
                
                <h2><i class="fa-solid fa-upload"></i> Document Ingestion</h2>
                <div class="input-group">
                    <label for="docId">Document ID</label>
                    <input type="text" id="docId" placeholder="e.g., doc_001">
                </div>
                <div class="input-group">
                    <label for="docText">Document Content</label>
                    <textarea id="docText" rows="6" placeholder="Paste raw text here to encode into the vector database..."></textarea>
                </div>
                <button id="ingestBtn" class="btn primary"><i class="fa-solid fa-cloud-arrow-up"></i> Ingest Text</button>
                <div id="ingestStatus" class="status-msg"></div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <section class="chat-section">
            <div class="glass-panel chat-container">
                <div id="chatHistory" class="chat-history">
                    <div class="message system-msg">
                        <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                        <div class="msg-content">
                            <strong>Welcome to the SentinelRAG Agent Hub.</strong><br>
                            This is your custom, high-performance HTML/JS frontend! Upload a document on the left and ask a question below to see the self-correcting agent in action.
                        </div>
                    </div>
                </div>
                
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Ask a question about your documents..." autocomplete="off">
                    <button id="sendBtn" class="btn send"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
